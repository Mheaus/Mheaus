name: Telemetry

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**]

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # STATS_TOKEN is a personal token. Without it, the stats leave out private contributions.
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --cached --quiet || git commit -m 'chore: refresh telemetry'
          git push
