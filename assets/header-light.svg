<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Mathieu Audebert — fullstack web developer, founder of Sakuga Software">
  <style>
    text { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
    .boot { opacity: 0; animation: appear .01s forwards; }
    @keyframes appear { to { opacity: 1; } }
    .title { animation: glitch 6s infinite; }
    .ghost-m { animation: ghostM 6s infinite; opacity: 0; }
    .ghost-c { animation: ghostC 6s infinite; opacity: 0; }
    @keyframes glitch { 0%,91%,100% { transform: none; } 92% { transform: translate(-3px,0) skewX(-8deg); } 94% { transform: translate(3px,0); } 96% { transform: none; } }
    @keyframes ghostM { 0%,91%,97%,100% { opacity: 0; } 92%,95% { opacity: .8; transform: translate(-6px,2px); } }
    @keyframes ghostC { 0%,91%,97%,100% { opacity: 0; } 93%,96% { opacity: .8; transform: translate(6px,-2px); } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { fill-opacity: .08; } 50% { fill-opacity: .45; } }
    .sweep { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(420px); } }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.96" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="0.48" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00879A" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.06"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#B97A00"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="420" fill="#E4E7EB"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <path d="M10 28V10H28M1172 10H1190V28M1190 392V410H1172M28 410H10V392"
        fill="none" stroke="#00879A" stroke-width="2" filter="url(#glow-soft)"/>
  <text x="38" y="23" font-size="11" fill="#8B93A0" letter-spacing="2">MHEAUS://SYS — TERMINAL DOGMA</text>
  <text x="1162" y="23" font-size="11" fill="#8B93A0" letter-spacing="2" text-anchor="end">EVA-UNIT // RX-78 // VF-1</text>

  <rect x="0" y="40" width="1200" height="10" fill="url(#hazard)" opacity=".85"/>
  <text x="1160" y="68" font-size="11" fill="#B97A00" text-anchor="end" letter-spacing="3">⚠ PATTERN BLUE — NOT AN ANGEL, JUST A DEVELOPER</text>

  <g transform="translate(60 162)">
    <text class="ghost-m" font-size="64" font-weight="800" fill="#D90F5A" letter-spacing="2">MATHIEU AUDEBERT</text>
    <text class="ghost-c" font-size="64" font-weight="800" fill="#00879A" letter-spacing="2">MATHIEU AUDEBERT</text>
    <text class="title" font-size="64" font-weight="800" fill="#1E232A" letter-spacing="2" filter="url(#glow)">MATHIEU AUDEBERT</text>
  </g>
  <text x="64" y="86" font-size="16" fill="#D90F5A" letter-spacing="6" filter="url(#glow-soft)">マチュー・オードベール ／ 開発者</text>

  
    <g class="boot" style="animation-delay:0.25s">
      <text x="64" y="208" font-size="15" fill="#8B93A0">&gt; MAGI-01 MELCHIOR ........</text>
      <text x="330" y="208" font-size="15" fill="#00879A" filter="url(#glow-soft)">ONLINE</text>
    </g>
    <g class="boot" style="animation-delay:0.53s">
      <text x="64" y="232" font-size="15" fill="#8B93A0">&gt; MAGI-02 BALTHASAR .......</text>
      <text x="330" y="232" font-size="15" fill="#00879A" filter="url(#glow-soft)">ONLINE</text>
    </g>
    <g class="boot" style="animation-delay:0.81s">
