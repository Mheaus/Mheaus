    </g>
    <g class="boot" style="animation-delay:1.37s">
      <text x="64" y="304" font-size="15" fill="#8B93A0">&gt; pilot ...................</text>
      <text x="330" y="304" font-size="15" fill="#1E232A" filter="url(#glow-soft)">MATHIEU AUDEBERT</text>
    </g>
    <g class="boot" style="animation-delay:1.6500000000000001s">
      <text x="64" y="328" font-size="15" fill="#8B93A0">&gt; unit ....................</text>
      <text x="330" y="328" font-size="15" fill="#1E232A" filter="url(#glow-soft)">@sakuga-software</text>
    </g>
    <g class="boot" style="animation-delay:1.9300000000000002s">
      <text x="64" y="352" font-size="15" fill="#8B93A0">&gt; sector ..................</text>
      <text x="330" y="352" font-size="15" fill="#1E232A" filter="url(#glow-soft)">BORDEAUX / FR</text>
    </g>
    <g class="boot" style="animation-delay:2.21s">
