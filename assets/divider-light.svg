<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="">
  <style>
    text { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
    .run { animation: run 3s linear infinite; }
    @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.96" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="0.48" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00879A" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.06"/>
    </pattern>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#B97A00"/>
    </pattern>
  </defs>
  <rect width="1200" height="24" fill="#E4E7EB"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#8B93A0"/>
  <rect y="11" width="200" height="2" fill="#D90F5A" class="run" filter="url(#glow)"/>
  <rect x="0" y="6" width="60" height="12" fill="url(#hazard)"/>
  <rect x="1140" y="6" width="60" height="12" fill="url(#hazard)"/>
</svg>